
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Navbar OCTOBER 27 2026</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">

        <!-- Amazon Logo -->
        <div class="logo">
            <span>amazon</span>
            <div class="smile"></div>
        </div>

        <!-- Delivery Address -->
        <div class="location">
            <span class="location-icon">♧</span>
            <div>
                <p>Deliver to</p>
                <h4>Bangladesh</h4>
            </div>
        </div>

        <!-- Search Bar -->
        <div class="search">
            <select aria-label="Search category">
                <option>All</option>
                <option>Electronics</option>
                <option>Books</option>
                <option>Fashion</option>
            </select>

            <input type="text" placeholder="Search Amazon">

            <button aria-label="Search">⌕</button>
        </div>

        <!-- Language -->
        <div class="language">
            <span>🇺🇸</span>
            <strong>EN</strong>
            <span class="arrow">▼</span>
        </div>

        <!-- Account -->
        <div class="account">
            <p>Hello, sign in</p>
            <h4>Account &amp; Lists <span>▼</span></h4>
        </div>

        <!-- Returns -->
        <div class="returns">
            <p>Returns</p>
            <h4>&amp; Orders</h4>
        </div>

        <!-- Cart -->
        <div class="cart">
            <span class="cart-icon">🛒</span>
            <span class="cart-count">0</span>
            <strong>Cart</strong>
        </div>

    </header>

</body>
</html>
